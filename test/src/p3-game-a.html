/* ───────────────────────── tiny math utils ───────────────────────── */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// 2D value noise (seeded, deterministic) — terrain lumps, tree density.
function makeNoise(SEED) {
  function hash2(ix, iz) {
    let n = (ix * 374761393 + iz * 668265263 + SEED * 69069) | 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return (((n ^ (n >>> 16)) >>> 0) / 4294967295) * 2 - 1;
  }
  function vnoise(x, z) {
    const ix = Math.floor(x), iz = Math.floor(z);
    const fx = x - ix, fz = z - iz;
    const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
    const a = hash2(ix, iz), b = hash2(ix + 1, iz);
    const c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
    return lerp(lerp(a, b, sx), lerp(c, d, sx), sz);
  }
  function noise2(x, z) { // two octaves is plenty for snow
    return vnoise(x, z) + 0.5 * vnoise(x * 2.13 + 7.3, z * 2.13 - 3.1);
  }
  return { hash2, noise2 };
}

/* ───────────────────────── course recipes ─────────────────────────

const ST_OPEN = 0, ST_SLALOM = 1, ST_HAIRPIN = 2, ST_RIDGE = 3, ST_CHUTE = 4, ST_MOGUL = 5;
function segList() {
  const SEGS = [];

    SEGS.push({ len, hdg, grade, w, style: style || ST_OPEN,
      ramp: !!(flags && flags.ramp), gate: !!(flags && flags.gate),
      scut: !!(flags && flags.scut),
      drop: (flags && flags.drop) || 0,   // 1 = chute drop-in, 2 = big ledge
      fin: !!(flags && flags.fin) });     // FINISH line at this segment's end
  };
  const slalomRun = (count, period, amp, grade, w, scut) => {
    let a = -amp;
    for (let i = 0; i < count; i++) { S(period, a, grade, w, ST_SLALOM, { scut }); a = -a; }
  };
  return { SEGS, S, slalomRun };
}

/* ─────────── baked-light shading, one flavor per mountain ─────────── */
// ALPENGLOW: cool violet shadows → warm peach light
const SUNX = -0.601, SUNY = 0.451, SUNZ = -0.661;
function shadeAlp(nx, ny, nz, r, g, b, out, o) {
  let d = nx * SUNX + ny * SUNY + nz * SUNZ;
  if (d < 0) d = 0;
  const l = 0.52 + 0.58 * d;
  out[o] = Math.min(1, r * l * (0.80 + 0.33 * d));
  out[o + 1] = Math.min(1, g * l * (0.86 + 0.14 * d));
  out[o + 2] = Math.min(1, b * l * (1.14 - 0.26 * d));
}
// NIGHT RIDGE: cold moonlight — deep indigo shadows, silver-blue light
const MX = 0.45, MY = 0.66, MZ = -0.60;
function shadeNight(nx, ny, nz, r, g, b, out, o) {
  let d = nx * MX + ny * MY + nz * MZ;
  if (d < 0) d = 0;
  const l = 0.40 + 0.44 * d;
  out[o] = Math.min(1, r * l * (0.56 + 0.18 * d));
  out[o + 1] = Math.min(1, g * l * (0.64 + 0.20 * d));
  out[o + 2] = Math.min(1, b * l * (1.02 + 0.22 * d));
}
// emissive-look bake: ignores the sun entirely (lanterns, gold trim, glows)
function shadeFlat(nx, ny, nz, r, g, b, out, o) {
  const f = 0.82 + 0.20 * Math.max(0, ny);
  out[o] = Math.min(1, r * f); out[o + 1] = Math.min(1, g * f); out[o + 2] = Math.min(1, b * f);
}
// DIAMONDBACK: flat storm light — low contrast, cold neutral greys
const DBX = 0.28, DBY = 0.80, DBZ = -0.53;
function shadeDb(nx, ny, nz, r, g, b, out, o) {
  let d = nx * DBX + ny * DBY + nz * DBZ;
  if (d < 0) d = 0;
  const l = 0.60 + 0.30 * d;
  out[o] = Math.min(1, r * l * (0.90 + 0.08 * d));
  out[o + 1] = Math.min(1, g * l * (0.93 + 0.06 * d));
  out[o + 2] = Math.min(1, b * l * (1.02 + 0.04 * d));
}

/* ═══════════════ buildCourseData(cfg) — everything data-side ═══════════════
   Integrates the segment recipe into dense samples, carves the hidden
   shortcut corridor (appended samples NSM..NS-1), builds the spatial hash
   and the terrain height closures. Returns the world data object.          */
function buildCourseData(cfg) {
  const SEGS = cfg.segs;
  const STEP = 3;
  const { hash2, noise2 } = makeNoise(cfg.seed);
  let COURSE_LEN = 0;
  for (const sg of SEGS) COURSE_LEN += sg.len;
  const NSM = Math.floor(COURSE_LEN / STEP) + 1;   // main-line sample count

  /* first pass: integrate the main line into temp arrays */
  const mCX = new Float64Array(NSM), mCZ = new Float64Array(NSM), mCY = new Float64Array(NSM);
  const mDX = new Float64Array(NSM), mDZ = new Float64Array(NSM);
  const mCURV = new Float64Array(NSM), mW = new Float64Array(NSM);
  const mBANK = new Float64Array(NSM), mWL = new Float64Array(NSM), mWR = new Float64Array(NSM);
  const mSTYLE = new Uint8Array(NSM), mRAMP = new Float64Array(NSM);
  const GATES = [], RAMPS = [], DROPS = [], DROPV = [];
  let FINISH_I = NSM - 1;
  let scStart = -1, scEnd = -1;
  {
    let x = cfg.origin.x, z = cfg.origin.z, y = 0, hdg = 0, s = 0, i = 0;
    let grade = SEGS[0].grade, wl = 0.55, wr = 0.55, wsm = SEGS[0].w;
    let segStartHdg = 0;
    let seg = 0, segS = 0;
    const D2R = Math.PI / 180;
    while (i < NSM && seg < SEGS.length) {
      const sg = SEGS[seg];
      const t = smoothstep(segS / sg.len);
      const targetHdg = lerp(segStartHdg, sg.hdg, t);
      const prevHdg = hdg;
      hdg = targetHdg;
      const phi = hdg * D2R;
      const dx = Math.sin(phi), dz = Math.cos(phi);
      grade += (sg.grade - grade) * (STEP / 22);
      wsm += (sg.w - wsm) * (STEP / 16);
      let twl, twr;
      if (sg.style === ST_RIDGE) { twl = -0.85; twr = 0.80; }
      else if (sg.style === ST_HAIRPIN) {
        const right = sg.hdg > segStartHdg;
        twl = right ? 0.95 : 0.22; twr = right ? 0.22 : 0.95;
      }
      else if (sg.style === ST_SLALOM) { twl = 0.34; twr = 0.34; }
      else if (sg.style === ST_CHUTE) { twl = 1.9; twr = 1.9; }   // granite walls
      else { twl = 0.55; twr = 0.55; }
      wl += (twl - wl) * (STEP / 18);
      wr += (twr - wr) * (STEP / 18);

      mCX[i] = x; mCZ[i] = z;
      const roll = (sg.style === ST_OPEN ? 0.55 : 0.15) *
        (Math.sin(s * 0.105) + 0.6 * Math.sin(s * 0.041 + 2.0));
      mCY[i] = y + roll;
      mDX[i] = dx; mDZ[i] = dz;
      mCURV[i] = ((hdg - prevHdg) * D2R) / STEP;
      mW[i] = wsm;
      mBANK[i] = clamp(mCURV[i] * 7, -0.32, 0.32);
      mWL[i] = wl; mWR[i] = wr;
      mSTYLE[i] = sg.style;
      if (sg.scut) { if (scStart < 0) scStart = i; scEnd = i; }

      x += dx * STEP; z += dz * STEP; y -= grade * STEP;
      s += STEP; segS += STEP;
      i++;
      if (segS >= sg.len) {
        if (sg.gate) GATES.push(i - 1);
        if (sg.ramp) RAMPS.push(i - 2);
        if (sg.fin) FINISH_I = i - 1;
        segS -= sg.len; segStartHdg = sg.hdg; seg++;
        // ledge drops & chute drop-ins: a sharp step down in the centreline
        // at the NEXT segment's start (both mesh AND physics read it via
        // terrainInfo — the "ground fell away" rule turns it into real air)
        const ns = SEGS[seg];
        if (ns && ns.drop) { y -= ns.drop >= 2 ? 6.0 : 3.2; DROPS.push(i); DROPV.push(ns.drop); }
      }
    }
    // smooth centreline height a touch (kills any integration kinks)
    for (let p = 0; p < 2; p++) {
      for (let j = 1; j < NSM - 1; j++) mCY[j] = (mCY[j - 1] + mCY[j] * 2 + mCY[j + 1]) * 0.25;
    }
    // bake ramp kickers: 16 m cubic rise to a 2.3 m lip
    for (const li of RAMPS) {
      for (let j = 0; j <= Math.floor(16 / STEP); j++) {
        const idx = li - Math.floor(16 / STEP) + j;
        if (idx < 0 || idx >= NSM) continue;
        const t = (idx - (li - 16 / STEP)) / (16 / STEP);
        mRAMP[idx] = 2.3 * t * t * t;
      }
    }
  }

  /* mogul-field amplitude envelope: per-sample bump amplitude, eased in and
     out over ~15 m at each field edge so the lattice never pops */
  const mMOG = new Float64Array(NSM);
  if (cfg.mogulAmp) {
    let runStart = -1;
    for (let i = 0; i <= NSM; i++) {
      const on = i < NSM && mSTYLE[i] === ST_MOGUL;
      if (on && runStart < 0) runStart = i;
      if (!on && runStart >= 0) {
        const runEnd = i - 1;
        for (let j = runStart; j <= runEnd; j++) {
          const e = Math.min(1, Math.min(j - runStart, runEnd - j) / 5);
          mMOG[j] = cfg.mogulAmp * smoothstep(e);
        }
        runStart = -1;
      }
    }
  }

  /* ── carve the HIDDEN SHORTCUT: a straightish tree corridor cutting the
        marked slalom, rejoining faster if skied clean. Appended samples get
        their own tighter terrain-blend reach so the main piste stays put. ── */
  let SC = null;
  let scPts = [];
  if (scStart >= 0 && cfg.sc) {
    const entryI = Math.max(4, scStart - 10);
    const exitI = Math.min(NSM - 4, scEnd + 10);
    const Ax = mCX[entryI], Az = mCZ[entryI];
    const Dx = mCX[exitI], Dz = mCZ[exitI];
    const chx = Dx - Ax, chz = Dz - Az;
    const chL = Math.hypot(chx, chz);
    const pxn = chz / chL * cfg.sc.side, pzn = -chx / chL * cfg.sc.side; // offset dir
    const M = Math.max(8, Math.round(chL / STEP) + 1);
    for (let k = 0; k < M; k++) {
      const t = k / (M - 1);
      const bulge = cfg.sc.off * Math.pow(Math.sin(Math.PI * t), 0.9);
      scPts.push({
        x: Ax + chx * t + pxn * bulge,
        z: Az + chz * t + pzn * bulge,
        y: lerp(mCY[entryI], mCY[exitI], t),
      });
    }
    // the slalom's mean path wanders relative to the chord, so push the
    // corridor OUT until its midline truly clears the groomed piste
    // (eased near entry/exit, then smoothed so the carve stays gentle)
    for (let iter = 0; iter < 3; iter++) {
      for (let k = 1; k < M - 1; k++) {
        const t = k / (M - 1);
        const p = scPts[k];
        let bd = 1e18, bi = entryI;
        for (let i = Math.max(0, entryI - 20); i <= Math.min(NSM - 1, exitI + 20); i++) {
          const d = (mCX[i] - p.x) * (mCX[i] - p.x) + (mCZ[i] - p.z) * (mCZ[i] - p.z);
          if (d < bd) { bd = d; bi = i; }
        }
        const d = Math.sqrt(bd);
        const need = (mW[bi] + 4.5) * Math.min(1, Math.min(t, 1 - t) * 6);
        if (d < need && d > 0.01) {
          const push = (need - d) * 0.7;
          let ux = (p.x - mCX[bi]) / d, uz = (p.z - mCZ[bi]) / d;
          if (d < 0.5) { ux = pxn; uz = pzn; }   // degenerate: push offset-side
          p.x += ux * push; p.z += uz * push;
        }
      }
      for (let k = 1; k < M - 1; k++) {          // 1-2-1 smoothing pass
        scPts[k].x = (scPts[k - 1].x + scPts[k].x * 2 + scPts[k + 1].x) * 0.25;
        scPts[k].z = (scPts[k - 1].z + scPts[k].z * 2 + scPts[k + 1].z) * 0.25;
      }
    }
    SC = { entryI, exitI, w: cfg.sc.w, side: cfg.sc.side, n: M };
  }
  const NSC = scPts.length;
  const NS = NSM + NSC;

  /* final struct-of-arrays (hot path reads these constantly) */
  const CX = new Float32Array(NS), CZ = new Float32Array(NS), CY = new Float32Array(NS);
  const CDX = new Float32Array(NS), CDZ = new Float32Array(NS);
  const CRX = new Float32Array(NS), CRZ = new Float32Array(NS);
  const CCURV = new Float32Array(NS), CW = new Float32Array(NS);
  const CBANK = new Float32Array(NS), CRAMP = new Float32Array(NS);
  const CWL = new Float32Array(NS), CWR = new Float32Array(NS);
  const CSTYLE = new Uint8Array(NS), CSC = new Uint8Array(NS);
  const CMOG = new Float32Array(NS);
  for (let i = 0; i < NSM; i++) {
    CX[i] = mCX[i]; CZ[i] = mCZ[i]; CY[i] = mCY[i];
    CDX[i] = mDX[i]; CDZ[i] = mDZ[i];
    CRX[i] = mDZ[i]; CRZ[i] = -mDX[i];
    CCURV[i] = mCURV[i]; CW[i] = mW[i]; CBANK[i] = mBANK[i]; CRAMP[i] = mRAMP[i];
    CWL[i] = mWL[i]; CWR[i] = mWR[i]; CSTYLE[i] = mSTYLE[i]; CMOG[i] = mMOG[i];
  }
  for (let k = 0; k < NSC; k++) {
    const i = NSM + k;
    const p = scPts[k];
    const pn = scPts[Math.min(NSC - 1, k + 1)], pp = scPts[Math.max(0, k - 1)];
    let tx = pn.x - pp.x, tz = pn.z - pp.z;
    const tl = Math.hypot(tx, tz) || 1; tx /= tl; tz /= tl;
    CX[i] = p.x; CZ[i] = p.z; CY[i] = p.y;
    CDX[i] = tx; CDZ[i] = tz; CRX[i] = tz; CRZ[i] = -tx;
    CCURV[i] = 0; CW[i] = SC.w; CBANK[i] = 0; CRAMP[i] = 0;
    CWL[i] = 0.42; CWR[i] = 0.42; CSTYLE[i] = ST_OPEN; CSC[i] = 1;
  }

  /* spatial hash over ALL samples (CSR) */
  const HCELL = 16;
  let HX0 = 1e9, HZ0 = 1e9, HX1 = -1e9, HZ1 = -1e9;
  for (let i = 0; i < NS; i++) {
    if (CX[i] < HX0) HX0 = CX[i]; if (CX[i] > HX1) HX1 = CX[i];
    if (CZ[i] < HZ0) HZ0 = CZ[i]; if (CZ[i] > HZ1) HZ1 = CZ[i];
  }
  HX0 -= 96; HZ0 -= 96; HX1 += 96; HZ1 += 96;
  const HW = Math.ceil((HX1 - HX0) / HCELL), HH = Math.ceil((HZ1 - HZ0) / HCELL);
  const hashStart = new Int32Array(HW * HH + 1);
  let hashItems;
  {
    const counts = new Int32Array(HW * HH);
    const cellOf = i => {
      const cx = Math.floor((CX[i] - HX0) / HCELL), cz = Math.floor((CZ[i] - HZ0) / HCELL);
      return cz * HW + cx;
    };
    for (let i = 0; i < NS; i++) counts[cellOf(i)]++;
    let acc = 0;
    for (let c = 0; c < HW * HH; c++) { hashStart[c] = acc; acc += counts[c]; }
    hashStart[HW * HH] = acc;
    hashItems = new Int32Array(acc);
    const cursor = hashStart.slice(0, HW * HH);
    for (let i = 0; i < NS; i++) { const c = cellOf(i); hashItems[cursor[c]++] = i; }
  }

  /* ─────────── terrain height function (THE ground truth) ───────────
     Blend of nearby samples' cross-profiles, elliptical weighting.
     Shortcut samples use a tighter reach so they shape their corridor
     without disturbing the groomed piste next door.                    */
  const R_LAT = 76;
  const R_SC = 34;
  const ALONG = 4;
  function profileY(j, u, nA, nB) {
    const w = CW[j];
    const au = u < 0 ? -u : u;
    let y = CY[j];
    if (CRAMP[j] > 0 && au < 5.2) {
      const t = au < 3.4 ? 1 : (5.2 - au) / 1.8;
      y += CRAMP[j] * (t * t * (3 - 2 * t));
    }
    if (au <= w) return y - CBANK[j] * u;
    const du = au - w;
    y -= CBANK[j] * (u < 0 ? -w : w);
    const ws = u < 0 ? CWL[j] : CWR[j];
    if (ws >= 0) {
      y += ws * du + 0.012 * du * du;
    } else {
      y += Math.max(ws * du, -13);
      if (du > 30) y += 0.5 * (du - 30);
    }
    const env = du < 7 ? du / 7 : 1;
    y += env * (nA * 1.7 + nB * 3.1);
    return y;
  }
  /* MOGUL LATTICE — a fixed analytic world-space bump field (staggered
     checkerboard, λ ≈ 3.4 x 3.0 m). It rides on the SAME blended height both
     the terrain mesh and the physics read, weighted by each contributing
     sample's field envelope and faded out at the groom edge — visual bumps
     and physical bumps are one function, by construction. */
  const MOG_C = Math.cos(0.43), MOG_S = Math.sin(0.43);
  const MOG_KA = Math.PI * 2 / 3.4, MOG_KB = Math.PI * 2 / 3.0;
  const TI = { h: 0, i: 0, u: 0, d: 1e9 };
  function terrainInfo(x, z) {
    const nA = noise2(x * 0.09, z * 0.09);
    const nB = noise2(x * 0.021 + 31.7, z * 0.021 - 12.9);
    const cx0 = Math.max(0, Math.floor((x - R_LAT - HX0) / HCELL));
    const cx1 = Math.min(HW - 1, Math.floor((x + R_LAT - HX0) / HCELL));
    const cz0 = Math.max(0, Math.floor((z - R_LAT - HZ0) / HCELL));
    const cz1 = Math.min(HH - 1, Math.floor((z + R_LAT - HZ0) / HCELL));
    let sw = 0, sy = 0, sm = 0, best = -1, bestD = 1e9, bestU = 0;
    for (let cz = cz0; cz <= cz1; cz++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const c = cz * HW + cx;
        for (let k = hashStart[c]; k < hashStart[c + 1]; k++) {
          const j = hashItems[k];
          const ddx = x - CX[j], ddz = z - CZ[j];
          const a = ddx * CDX[j] + ddz * CDZ[j];
          const u = ddx * CRX[j] + ddz * CRZ[j];
          const de = Math.sqrt(ALONG * ALONG * a * a + u * u);
          const reach = CSC[j] ? R_SC : R_LAT;
          if (de >= reach) continue;
          let wgt = 1 - de / reach;
          wgt = wgt * wgt; wgt = wgt * wgt * wgt;      // ^6: nearest dominates
          sw += wgt; sy += wgt * profileY(j, u, nA, nB);
          if (CMOG[j] > 0) {
            const au = u < 0 ? -u : u;
            const w = CW[j];
            const lat = au < w - 1.4 ? 1 : au < w + 0.6 ? (w + 0.6 - au) * 0.5 : 0;
            if (lat > 0) sm += wgt * CMOG[j] * lat;
          }
          if (de < bestD) { bestD = de; best = j; bestU = u; }
        }
      }
    }
    if (sw > 0) {
      let h = sy / sw;
      if (sm > 0) {
        const xr = x * MOG_C - z * MOG_S, zr = x * MOG_S + z * MOG_C;
        h += (sm / sw) * Math.sin(xr * MOG_KA) * Math.sin(zr * MOG_KB);
      }
      TI.h = h; TI.i = best; TI.u = bestU; TI.d = bestD;
    }
    else { TI.h = 500; TI.i = -1; TI.u = 0; TI.d = 1e9; }
    return TI;
  }
  function terrainH(x, z) { return terrainInfo(x, z).h; }
  const GRAD = { x: 0, z: 0 };
  function terrainGrad(x, z) {
    const e = 1.4;
    const hx1 = terrainH(x + e, z), hx0 = terrainH(x - e, z);
    const hz1 = terrainH(x, z + e), hz0 = terrainH(x, z - e);
    GRAD.x = (hx1 - hx0) / (2 * e);
    GRAD.z = (hz1 - hz0) / (2 * e);
    return GRAD;
  }

  /* course feature ranges (harness targeting + drop chevrons) */
  const FEATS = { moguls: [], chutes: [], drops: [] };
  {
    let rs = -1, rw = 1e9, rst = 0;
    const close = (endI) => {
      if (rs < 0) return;
      const rec = { s0: rs * STEP, s1: endI * STEP, len: (endI - rs) * STEP, w: Math.round(rw * 10) / 10 };
      if (rst === ST_MOGUL) FEATS.moguls.push(rec);
      else FEATS.chutes.push(rec);
      rs = -1; rw = 1e9;
    };
    for (let i = 0; i <= NSM; i++) {
      const st = i < NSM ? mSTYLE[i] : -1;
      const feat = st === ST_MOGUL || st === ST_CHUTE;
      if (feat && rs < 0) { rs = i; rst = st; }
      else if (rs >= 0 && st !== rst) { close(i - 1); if (feat) { rs = i; rst = st; } }
      if (rs >= 0 && i < NSM && mW[i] < rw) rw = mW[i];
    }
    for (let k = 0; k < DROPS.length; k++) {
      FEATS.drops.push({ s: DROPS[k] * STEP, big: DROPV[k] >= 2 });
    }
  }

  return {
    cfg, STEP, NSM, NS, NSC, COURSE_LEN,
    CX, CZ, CY, CDX, CDZ, CRX, CRZ, CCURV, CW, CBANK, CRAMP, CWL, CWR, CSTYLE, CSC, CMOG,
    GATES, RAMPS, DROPS, FEATS, FINISH_I, SC,
    HX0, HZ0, HX1, HZ1,
    terrainInfo, terrainH, terrainGrad,
    hash2, noise2,
    // filled in by the scene builder:
    tiles: null, obs: null, sky: null, peaks: [], snowman: null,
    goldTrim: null, extras: null,
  };
}
