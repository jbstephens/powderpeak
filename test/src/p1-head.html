<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Powder Peak">
<title>Powder Peak</title>
<link rel="icon" href="data:,">
<script src="https://ses.q5labs.co/lib/controller.js"></script>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #14162a;
    font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    color: #f4f6ff;
    touch-action: none;
  }

  /* ── fixed 1280x720 stage, CSS-scaled to letterbox any viewport ── */
  #stage {
    position: fixed; left: 50%; top: 50%;
    width: 1280px; height: 720px;
    transform: translate(-50%,-50%) scale(1);
    transform-origin: center center;
    background: #f2b3ab;
    overflow: hidden;
  }
  #gl { position: absolute; inset: 0; display: block; }

  /* ── chunky skewed navy panels (reference style) ── */
  .panel {
    position: absolute;
    color: #f4f6ff;
    z-index: 0; /* own stacking context so the ::before backplate stays inside */
  }
  .panel::before {
    content: '';
    position: absolute; inset: 0;
    background: #20233d;
    transform: skewX(-12deg);
    border: 2px solid #12142a;
    z-index: -1;
  }
  .ptitle {
    font-size: 13px; font-weight: 700; letter-spacing: 2px;
    color: #ffd23e;
  }

  /* descent profile — top-left */
  #profilePanel { left: 26px; top: 20px; width: 300px; height: 108px; padding: 8px 14px 6px 16px; }
  #profilePanel .phead { display: flex; justify-content: space-between; align-items: baseline; }
  #profilePanel .phead span:last-child { color: #fff; font-size: 12px; font-weight: 700; }
  #profileWrap { position: relative; width: 268px; height: 56px; margin-top: 3px; }
  #profileCanvas { position: absolute; left: 0; top: 0; }
  #profMarker {
    position: absolute; left: 0; top: 0; width: 7px; height: 7px;
    margin-left: -3px; margin-top: -3px;
    background: #fff; border: 1px solid #20233d; border-radius: 50%;
    will-change: transform;
  }
  #profilePanel .pfoot {
    display: flex; justify-content: space-between;
    font-size: 9px; letter-spacing: 1px; color: #aab; font-weight: 700;
  }

  /* big time — top-center */
  #timePanel {
    left: 50%; top: 20px; width: 330px; height: 64px;
    margin-left: -165px;
    display: flex; align-items: center; justify-content: center; gap: 16px;
  }
  #timePanel .tlabel { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #ffd23e; margin-top: -22px; }
  #timeText { font-size: 42px; font-weight: 700; letter-spacing: 2px; color: #fff; font-variant-numeric: tabular-nums; }

  /* split delta popup under the clock */
  #splitPop {
    position: absolute; left: 50%; top: 92px; width: 260px; margin-left: -130px;
    text-align: center; font-size: 20px; font-weight: 700; letter-spacing: 1px;
    opacity: 0; will-change: opacity, transform;
  }
  #splitPop.good { color: #63e58b; } #splitPop.bad { color: #ff5964; } #splitPop.neutral { color: #ffd23e; }
  #splitPop.show { animation: splitpop 2.2s ease-out forwards; }
  @keyframes splitpop {
    0% { opacity: 0; transform: translateY(-8px); }
    12% { opacity: 1; transform: translateY(0); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translateY(6px); }
  }

  /* sector chip — bottom-left */
  #sectorPanel {
    left: 26px; bottom: 24px; width: 240px; height: 52px; padding: 8px 16px;
    font-size: 14px; font-weight: 700; letter-spacing: 2px;
  }
  #sectorPanel .big { font-size: 22px; color: #ffd23e; }
  #sectorPanel .row2 { font-size: 11px; color: #aab; letter-spacing: 1px; margin-top: 2px; }
  #sectorPanel .row2 b { color: #fff; }

  /* speed gauge — bottom-right */
  #gauge { position: absolute; right: 22px; bottom: 16px; width: 190px; height: 158px; }
  #gaugePanel {
    position: absolute; right: 0; bottom: 0; width: 150px; height: 74px;
    z-index: 0;
  }
  #gaugePanel::before {
    content: ''; position: absolute; inset: 0;
    background: #20233d; transform: skewX(-12deg);
    border: 2px solid #12142a; z-index: -1;
  }
  #gaugeCanvas { position: absolute; left: 0; top: 0; }
  #needle {
    position: absolute; left: 79px; top: 14px; width: 5px; height: 64px;
    margin-left: -2.5px;
    background: linear-gradient(#ffd23e 62%, transparent 62%);
    transform-origin: 50% 100%;
    will-change: transform;
    z-index: 1;
  }
  #speedNum {
    position: absolute; right: 46px; bottom: 12px;
    font-size: 44px; font-weight: 700; color: #fff; line-height: 1;
    font-variant-numeric: tabular-nums; text-align: right;
  }
  #speedUnit {
    position: absolute; right: 10px; bottom: 14px;
    font-size: 12px; font-weight: 700; color: #ffd23e; letter-spacing: 1px;
    writing-mode: horizontal-tb;
  }

  /* center flash text (CHECKPOINT / GO / FINISH) */
  #flash {
    position: absolute; left: 0; right: 0; top: 200px;
    text-align: center;
    font-size: 46px; font-weight: 700; letter-spacing: 10px;
    color: #fff;
    text-shadow: 0 3px 0 #20233d, 0 0 2px #20233d;
    opacity: 0; will-change: opacity, transform;
    pointer-events: none;
  }
  #flash.show { animation: flashpop 1.5s ease-out forwards; }
  @keyframes flashpop {
    0% { opacity: 0; transform: scale(0.85); }
    10% { opacity: 1; transform: scale(1.04); }
    16% { transform: scale(1); }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }

  #hud { position: absolute; inset: 0; pointer-events: none; }
  body.st-title #hud, body.st-finish #hud .hidefinish { display: none; }

  /* ── title screen ── */
  #title { position: absolute; inset: 0; display: none; pointer-events: none; }
  body.st-title #title { display: block; }
  #logo {
    position: absolute; left: 50%; top: 120px; transform: translateX(-50%);
    text-align: center;
  }
  #logo .l1 {
    font-size: 84px; font-weight: 700; letter-spacing: 14px;
    color: #fff;
    text-shadow: 0 5px 0 #20233d, 0 -2px 0 #ff5964, 4px 8px 0 rgba(18,20,42,0.45);
  }
  #logo .l2 {
    display: inline-block;
    margin-top: 6px; padding: 6px 26px;
    background: #20233d; transform: skewX(-12deg);
    font-size: 22px; letter-spacing: 8px; font-weight: 700; color: #ffd23e;
  }
  #logo .l2 span { display: inline-block; transform: skewX(12deg); }
  #pressStart {
    position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%);
    padding: 12px 34px;
    background: #20233d;
    font-size: 22px; font-weight: 700; letter-spacing: 4px; color: #fff;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  #titleBest {
    position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%);
    font-size: 15px; font-weight: 700; letter-spacing: 3px; color: #ffd23e;
    text-shadow: 0 2px 0 #20233d;
  }
  #titleHint {
    position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 2px; color: #e8ecff;
    text-shadow: 0 1px 0 #20233d;
    text-align: center; line-height: 1.9;
  }

  /* ── countdown ── */
  #countdownEl {
    position: absolute; left: 0; right: 0; top: 240px;
    text-align: center;
    font-size: 120px; font-weight: 700; color: #fff;
    text-shadow: 0 6px 0 #20233d;
    display: none; pointer-events: none;
  }

  /* ── pause ── */
  #pauseMenu {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(18,20,42,0.55);
  }
  body.st-pause #pauseMenu { display: flex; }
  #pauseMenu .pbox {
    background: #20233d; border: 2px solid #12142a;
    padding: 30px 60px 34px; text-align: center;
    transform: skewX(-6deg);
  }
  #pauseMenu .pbox > * { transform: skewX(6deg); }
  #pauseMenu h2 { font-size: 34px; letter-spacing: 8px; color: #fff; margin-bottom: 24px; }
  .mitem {
    font-size: 20px; font-weight: 700; letter-spacing: 4px; color: #9aa0c0;
    padding: 8px 18px; margin: 4px 0;
  }
  .mitem.sel { color: #ffd23e; background: #171930; }
  .mitem.sel::before { content: '▶ '; color: #ff5964; }

  /* ── finish ── */
  #finishScreen {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    pointer-events: none;
  }
  body.st-finish #finishScreen { display: flex; }
  #finishScreen .fbox {
    background: #20233d; border: 2px solid #12142a;
    padding: 26px 64px 30px; text-align: center;
    transform: skewX(-6deg);
  }
  #finishScreen .fbox > * { transform: skewX(6deg); }
  #finishScreen h2 { font-size: 40px; letter-spacing: 12px; color: #fff; }
  #medalLine { font-size: 24px; font-weight: 700; letter-spacing: 4px; margin: 10px 0 2px; }
  #medalLine.gold { color: #ffd23e; } #medalLine.silver { color: #d8dce8; } #medalLine.bronze { color: #e8945a; }
  #finalTime { font-size: 54px; font-weight: 700; color: #ffd23e; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  #newBest { font-size: 16px; font-weight: 700; letter-spacing: 4px; color: #63e58b; height: 22px; margin-top: 2px; }
  #splitTable { margin: 12px auto 4px; font-size: 15px; letter-spacing: 1px; color: #e8ecff; text-align: left; font-variant-numeric: tabular-nums; }
  #splitTable td { padding: 1px 12px; }
  #splitTable .d.good { color: #63e58b; } #splitTable .d.bad { color: #ff5964; } #splitTable .d { color: #9aa0c0; }
  #finishPrompt { margin-top: 14px; font-size: 16px; font-weight: 700; letter-spacing: 3px; color: #fff; animation: pulse 1.4s ease-in-out infinite; }

  /* ── white fade for respawn ── */
  #fadeWhite {
    position: absolute; inset: 0; background: #fff;
    opacity: 0; pointer-events: none;
    transition: opacity 0.22s linear;
  }

  /* ── touch controls (touch input source only) ── */
  #touchUI { position: absolute; inset: 0; display: none; pointer-events: none; }
  body.input-touch #touchUI { display: block; }
  body.st-title #touchUI, body.st-finish #touchUI { display: none; }
  .tzone { position: absolute; top: 0; bottom: 0; width: 50%; pointer-events: auto; }
  #tzoneL { left: 0; } #tzoneR { right: 0; }
  .tbtn {
    position: absolute; bottom: 96px; width: 92px; height: 92px;
    border-radius: 50%;
    background: rgba(32,35,61,0.55);
    border: 3px solid rgba(255,255,255,0.5);
    color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
  }
  .tbtn.held { background: rgba(255,210,62,0.5); border-color: #ffd23e; }
  #tbtnBrake { left: 26px; }
  #tbtnTuck { right: 26px; }
  #tbtnPause {
    position: absolute; top: 14px; right: 14px; width: 52px; height: 44px;
    border-radius: 8px;
    background: rgba(32,35,61,0.55); border: 2px solid rgba(255,255,255,0.5);
    color: #fff; font-size: 18px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
  }
</style>
</head>
<body class="st-title">
<div id="stage">
  <canvas id="gl" width="1280" height="720"></canvas>

  <div id="hud">
    <div id="profilePanel" class="panel">
      <div class="phead"><span class="ptitle">DESCENT PROFILE</span><span id="gradePct">0%</span></div>
      <div id="profileWrap">
        <canvas id="profileCanvas" width="268" height="56"></canvas>
        <div id="profMarker"></div>
      </div>
      <div class="pfoot"><span>SUMMIT</span><span>FINISH</span></div>
    </div>

    <div id="timePanel" class="panel">
      <span class="tlabel">TIME</span><span id="timeText">0:00.00</span>
    </div>
    <div id="splitPop"></div>

    <div id="sectorPanel" class="panel">
      <span>SECTOR <span class="big" id="sectorNum">1</span>/4</span>
      <div class="row2">BEST <b id="bestChip">--:--.--</b></div>
    </div>

    <div id="gauge">
      <div id="gaugePanel"></div>
      <canvas id="gaugeCanvas" width="190" height="158"></canvas>
      <div id="needle"></div>
      <div id="speedNum">0</div>
      <div id="speedUnit">KM/H</div>
    </div>

    <div id="flash"></div>
  </div>

  <div id="title">
    <div id="logo">
      <div class="l1">POWDER</div>
      <div class="l2"><span>P E A K</span></div>
    </div>
    <div id="pressStart">PRESS ✕ TO SKI</div>
    <div id="titleBest"></div>
    <div id="titleHint">STICK CARVE · HOLD ✕ TUCK · HOLD ▢ BRAKE · START PAUSE<br>KEYS: ◄ ► STEER · ▼ TUCK · ▲ BRAKE</div>
  </div>

  <div id="countdownEl"></div>

  <div id="pauseMenu">
    <div class="pbox">
      <h2>PAUSED</h2>
      <div class="mitem" id="mi0">RESUME</div>
      <div class="mitem" id="mi1">RESTART RUN</div>
    </div>
  </div>

  <div id="finishScreen">
    <div class="fbox">
      <h2>FINISH</h2>
      <div id="medalLine"></div>
      <div id="finalTime">0:00.00</div>
      <div id="newBest"></div>
      <table id="splitTable"></table>
      <div id="finishPrompt">PRESS ✕ TO SKI AGAIN</div>
    </div>
  </div>

  <div id="fadeWhite"></div>

  <div id="touchUI">
    <div class="tzone" id="tzoneL"></div>
    <div class="tzone" id="tzoneR"></div>
    <div class="tbtn" id="tbtnBrake">BRAKE</div>
    <div class="tbtn" id="tbtnTuck">TUCK</div>
    <div id="tbtnPause">II</div>
  </div>
</div>
